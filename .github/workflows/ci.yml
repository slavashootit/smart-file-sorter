name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Build Project
        run: swift build

      - name: Run Tests with Code Coverage
        run: swift test --parallel --enable-code-coverage

      - name: Verify Code Coverage
        run: |
          # Find the compiled test binary
          TEST_BINARY=""
          for bundle in $(find .build -name "*.xctest" -type d 2>/dev/null); do
            binary_name=$(basename "$bundle" .xctest)
            binary_path="$bundle/Contents/MacOS/$binary_name"
            if [ -f "$binary_path" ]; then
              TEST_BINARY="$binary_path"
              break
            fi
          done
          
          if [ -z "$TEST_BINARY" ]; then
            for f in $(find .build -type f 2>/dev/null); do
              if [ -x "$f" ]; then
                case "$f" in
                  *Tests|*PackageTests)
                    TEST_BINARY="$f"
                    break
                    ;;
                esac
              fi
            done
          fi
          
          if [ -z "$TEST_BINARY" ]; then
            echo "Error: Test binary not found!"
            exit 1
          fi
          
          echo "Found Test Binary: $TEST_BINARY"
          
          # Find the default.profdata file
          PROFDATA=$(find .build -name "default.profdata" -type f | head -n 1)
          if [ -z "$PROFDATA" ]; then
            echo "Error: default.profdata not found!"
            exit 1
          fi
          echo "Found Profile Data: $PROFDATA"
          
          # Generate coverage report for Models, ignoring UI/infrastructure/ML files
          xcrun llvm-cov report "$TEST_BINARY" -instr-profile="$PROFDATA" -ignore-filename-regex="(DesignSystem|SorterAppIntents|WatcherViewModel|SoundManager|ImageClassifier|AIModelManager|SemanticSearchEngine|OCRDatabase|SimilarPhotosFinder|DiskAnalyzer|ScheduleManager|SmartSelectionLearner|ProfileManager|SorterServicesProvider)" Sources/SmartFileSorter/Models/ > coverage_report.txt
          
          # Run python parser to verify coverage is >= 60%
          python3 -c "
          import sys, re
          with open('coverage_report.txt') as f:
              content = f.read()
          print(content)
          lines = content.splitlines()
          total_line = [l for l in lines if l.startswith('TOTAL')]
          if not total_line:
              print('Error: Could not find TOTAL row in coverage report')
              sys.exit(1)
          total_cols = total_line[0].split()
          percentages = [c for c in total_cols if '%' in c]
          if len(percentages) < 3:
              print(f'Error: Could not find enough percentage columns in TOTAL row: {total_cols}')
              sys.exit(1)
          cov_val = float(percentages[2].replace('%', ''))
          print(f'Line Coverage of Models: {cov_val}%')
          if cov_val < 60.0:
              print(f'Error: Coverage {cov_val}% is below the required 60%')
              sys.exit(1)
          print('Success: Coverage requirement met!')
          "
